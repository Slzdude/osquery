name: build-wrapper

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

concurrency:
  group: wrapper-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  OSQUERY_TOOLCHAIN_VERSION: 1.2.0

jobs:
  build_linux:
    runs-on: ubuntu-22.04

    steps:
    - name: Free disk space
      run: |
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
        sudo apt-get purge -y 'clang-*' 'llvm-*' 'php*' 'mono-*' 'dotnet-*' google-chrome-stable firefox snapd || true
        sudo apt-get autoremove -y && sudo apt-get clean
        df -h

    - name: Install osquery-toolchain
      run: |
        wget -q https://github.com/osquery/osquery-toolchain/releases/download/${{ env.OSQUERY_TOOLCHAIN_VERSION }}/osquery-toolchain-${{ env.OSQUERY_TOOLCHAIN_VERSION }}-$(uname -m).tar.xz
        sudo tar xf osquery-toolchain-${{ env.OSQUERY_TOOLCHAIN_VERSION }}-$(uname -m).tar.xz -C /usr/local

    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update submodules
      run: git submodule sync --recursive && git submodule update --init --recursive

    - name: Configure
      run: |
        cmake -G "Unix Makefiles" \
          -DOSQUERY_TOOLCHAIN_SYSROOT:PATH="/usr/local/osquery-toolchain" \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DOSQUERY_BUILD_TESTS=OFF \
          .

    - name: Build wrapper
      run: cmake --build . --target osquery_wrapper -j $(($(nproc) + 1))

    - name: Verify symbols
      run: |
        nm -D osquery/osquery/libosquery_wrapper.so | grep -c " T osquery_" | grep -q "7"
        echo "✓ All 7 symbols exported"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libosquery_wrapper-linux-x86_64
        path: osquery/osquery/libosquery_wrapper.so

  build_macos:
    runs-on: macos-15

    steps:
    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update submodules
      run: git submodule sync --recursive && git submodule update --init --recursive

    - name: Configure
      run: |
        cmake -G "Unix Makefiles" \
          -DCMAKE_OSX_ARCHITECTURES="arm64" \
          -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15" \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DOSQUERY_BUILD_TESTS=OFF \
          .

    - name: Build wrapper
      run: cmake --build . --target osquery_wrapper -j $(($(sysctl -n hw.logicalcpu) + 1))

    - name: Verify symbols
      run: |
        nm -g osquery/osquery/libosquery_wrapper.dylib | grep -c " T _osquery_" | grep -q "7"
        echo "✓ All 7 symbols exported"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: libosquery_wrapper-macos-arm64
        path: osquery/osquery/libosquery_wrapper.dylib

  build_windows:
    runs-on: windows-2022

    steps:
    - name: Configure git
      run: |
        git config --global core.autocrlf false
        git config --global core.symlinks true

    - name: Clone repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Update submodules
      run: git submodule sync --recursive && git submodule update --init --recursive

    - name: Install Ninja
      run: |
        choco install ninja -y

    - name: Configure
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        cmake -G Ninja ^
          -DCMAKE_C_COMPILER=cl.exe ^
          -DCMAKE_CXX_COMPILER=cl.exe ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DOSQUERY_BUILD_TESTS=OFF ^
          .

    - name: Build wrapper
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
        cmake --build . --target osquery_wrapper -j %NUMBER_OF_PROCESSORS%

    - name: Verify DLL exports
      shell: powershell
      run: |
        $dll = "osquery\osquery\osquery_wrapper.dll"
        if (Test-Path $dll) {
          echo "✓ osquery_wrapper.dll built successfully"
          (Get-Item $dll).Length / 1MB
        } else {
          echo "✗ DLL not found"
          exit 1
        }

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: osquery_wrapper-windows-x64
        path: |
          osquery/osquery/osquery_wrapper.dll
          osquery/osquery/osquery_wrapper.lib
          osquery/osquery/osquery_wrapper.exp

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build_linux, build_macos, build_windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release
        cp artifacts/libosquery_wrapper-linux-x86_64/libosquery_wrapper.so release/
        cp artifacts/libosquery_wrapper-macos-arm64/libosquery_wrapper.dylib release/
        cp artifacts/osquery_wrapper-windows-x64/osquery_wrapper.dll release/
        cp artifacts/osquery_wrapper-windows-x64/osquery_wrapper.lib release/
        cd release && sha256sum * > checksums.txt

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: release/*
        generate_release_notes: true
